[project]
name = "casefinder"
version = "0.1.0"
description = "Similar-case search for chest X-rays, with retrieval benchmarks"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30", "huggingface_hub>=0.25", "tzdata", "casefinder[agent]"]
agent = ["langgraph>=1.2", "langchain-core>=1.0", "langchain-google-genai>=4.4", "langfuse>=5.0", "python-dotenv>=1.0"]
scripts = ["pandas>=2", "pyarrow>=15", "huggingface_hub>=0.25"]
eval = ["torch>=2.2", "transformers>=4.40,<5", "f1chexbert==0.0.2", "scikit-learn>=1.4", "appdirs>=1.4",
        "casefinder[scripts]"]
aws = ["boto3>=1.34"]
load = ["locust>=2.20", "casefinder[aws]"]
dev = ["pytest>=8", "nbformat>=5", "httpx>=0.27", "scikit-learn>=1.4", "moto[dynamodb,ssm]>=5", "casefinder[api,scripts,aws]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
